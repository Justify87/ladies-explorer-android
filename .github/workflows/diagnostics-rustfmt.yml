name: Diagnostics one-shot rustfmt

on:
  push:
    branches: [feature/diagnostics-tracing-har-m0-m4]
    paths:
      - 'rust/**'
      - '.github/workflows/diagnostics-rustfmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - name: Format and commit
        run: |
          cd rust
          cargo fmt --all
          cd ..
          if ! git diff --quiet -- rust; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rust
            git commit -m "style(rust): apply canonical rustfmt after diagnostics corrections"
            git push
          fi
