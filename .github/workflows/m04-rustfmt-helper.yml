name: M04 formatter
on:
  push:
    branches: [feature/m04-identity-media-history]
permissions:
  contents: write
jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/m04-identity-media-history
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - run: |
          cd rust
          cargo fmt --all
          cd ..
          git add rust/
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(m04): rustfmt second pass"
            git push origin HEAD:feature/m04-identity-media-history
          fi
