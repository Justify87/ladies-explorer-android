name: Temporary Rust format for diagnostics PR
on:
  push:
    branches:
      - feature/diagnostics-tracing-har-m0-m4
    paths:
      - .github/workflows/diagnostics-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - run: |
          cd rust
          cargo fmt --all
          cd ..
          git add rust
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(rust): rustfmt diagnostics modules (M4)"
            git push
          fi
