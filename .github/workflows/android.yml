name: Android and Rust

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_native_cache:
        description: 'Optional diagnostic only: verify native task cache contract (slow)'
        type: boolean
        default: false
      measure_android_build:
        description: 'Optional diagnostic only: measure Android build performance (slow)'
        type: boolean
        default: false

permissions:
  contents: read

# New commits supersede outdated PR checks, but not main/manual builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      native_qualification: ${{ steps.classify.outputs.native_qualification }}
      performance_measurement: ${{ steps.classify.outputs.performance_measurement }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Push ancestry needs full history; PRs need only the checked merge and its parents.
          fetch-depth: ${{ github.event_name != 'push' && 2 || 0 }}
          persist-credentials: false
      - name: Verify scope policy
        run: python3 -m unittest discover -s tools -p test_ci_scope.py
      - name: Classify complete event diff
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          VERIFY_NATIVE_CACHE: ${{ inputs.verify_native_cache }}
          MEASURE_ANDROID_BUILD: ${{ inputs.measure_android_build }}
        run: python3 tools/ci_scope.py

  core:
    name: Core and contracts
    needs: scope
    if: ${{ needs.scope.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          persist-credentials: false

      - name: Rust 1.99 host toolchain
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-host
          workspaces: rust -> target
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      # Independent checks still run on failure; the aggregate gate must fail.
      - name: Architecture source contracts and regression tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          python3 -m unittest discover -s tools -p test_check_architecture.py
          python3 tools/check_architecture.py

      - name: Generate synthetic M05 reference
        id: fixture
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 tools/m05-reference.py "$RUNNER_TEMP/m05-reference" --clock 2026-11-18T12:00:00+00:00

      - name: Rust formatting
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Rust unit tests
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        working-directory: rust
        run: cargo test --workspace --locked

      - name: Synthetic native database regression
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.fixture.outcome == 'success' }}
        working-directory: rust
        run: M05_REFERENCE_DB="$RUNNER_TEMP/m05-reference/ladies.sqlite" cargo test --workspace --locked m05_native_reference_fixture -- --ignored

      - name: Rust Clippy
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked

  android:
    name: Android integration
    needs: scope
    if: ${{ needs.scope.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      native_qualification: ${{ steps.native_qualification.outcome }}
      performance_measurement: ${{ steps.performance_measurement.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Use basic caching if the enhanced provider is incompatible.
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Rust 1.99 with Android arm64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: aarch64-linux-android

      - name: Install required Android SDK and NDK
        run: |
          platform="$ANDROID_HOME/platforms/android-37.0"
          ndk="$ANDROID_HOME/ndk/29.0.14206865"
          platform_ready() { test -s "$platform/android.jar"; }
          ndk_ready() {
            test -s "$ndk/source.properties" &&
              grep -Eq '^Pkg\.Revision[[:space:]]*=[[:space:]]*29\.0\.14206865[[:space:]]*$' "$ndk/source.properties" &&
              test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" &&
              test -d "$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          }
          packages=()
          if ! platform_ready; then packages+=("platforms;android-37.0"); fi
          if ! ndk_ready; then packages+=("ndk;29.0.14206865"); fi
          if ((${#packages[@]})); then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${packages[@]}"
          else
            echo "Required Android SDK and NDK already installed"
          fi
          platform_ready
          ndk_ready

      - name: Identify native dependency toolchain
        id: native_identity
        working-directory: rust
        run: |
          set -euo pipefail
          cargo_path="${CARGO:-$HOME/.cargo/bin/cargo}"
          ndk="$ANDROID_HOME/ndk/29.0.14206865"
          # Match the controlled compiler environment in app/build.gradle.kts, not the runner image.
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC
          identity="$RUNNER_TEMP/native-dependency-identity"
          {
            printf '%s\n' "$cargo_path" "$PWD" "$ndk"
            env -i PATH="$PATH" HOME="$HOME" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_INCREMENTAL=0 LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC bash -euc '
              "$1" --version --verbose
              rustc --version --verbose
              cc --version
              c++ --version
              ld --version
              ldd --version
            ' _ "$cargo_path"
            cat "$ndk/source.properties"
            grep '^ladies.minApi=' ../gradle.properties
            sha256sum ../tools/install-cargo-ndk.sh
          } > "$identity"
          key="$(sha256sum "$identity" | cut -d' ' -f1)"
          echo "Native dependency environment: $key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore Android Rust dependencies
        id: rust_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk*
            rust/target
          key: native-android-v1-${{ steps.native_identity.outputs.key }}-${{ hashFiles('app/build.gradle.kts', 'gradle.properties', 'rust/**/Cargo.toml', 'rust/Cargo.lock', 'rust/**/rust-toolchain*', 'rust/**/.cargo/config*', '.cargo/config*') }}
          restore-keys: |
            native-android-v1-${{ steps.native_identity.outputs.key }}-

      - name: Install cargo-ndk
        run: |
          bash tools/install-cargo-ndk.sh
          test "$(cargo ndk --version)" = 'cargo-ndk 4.1.2'

      - name: Build arm64 APK and device test APK, run JVM tests and Android Lint
        id: gradle
        env:
          CI05_DIAGNOSTICS: ${{ needs.scope.outputs.performance_measurement }}
        run: |
          args=()
          if [ "$CI05_DIAGNOSTICS" = true ]; then
            args+=(--info -Dorg.gradle.caching.debug=true -Pkotlin.build.report.output=file)
          fi
          set -o pipefail
          log="$RUNNER_TEMP/android-gradle-build.log"
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug -Pladies.abis=arm64-v8a -Pladies.nativeCache=true --stacktrace --continue --profile --console=plain "${args[@]}" | tee "$log"
          if grep -Fxq '> Task :app:cargoBuildDebug' "$log" &&
             grep -Fxq '> Task :app:uniffiBindgenDebug' "$log" &&
             ! grep -Fq 'CI02: native task output cache disabled' "$log"; then
            echo "native_dependencies_built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify packaged architecture contracts
        run: |
          set -- app/build/outputs/apk/debug/*.apk
          test "$#" = 1
          test -f "$1"
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          test -x "$aapt2"
          python3 tools/check_architecture.py --apk "$1" --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" --aapt2 "$aapt2"

      - name: Upload debug APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: ladies-explorer-android-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Prepare compiled Rust dependency cache
        id: prepare_rust_cache
        if: ${{ steps.gradle.outputs.native_dependencies_built == 'true' && steps.rust_cache.outputs.cache-hit != 'true' && steps.rust_cache.outputs.cache-primary-key != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        working-directory: rust
        run: |
          set -euo pipefail
          # Gradle can restore both outputs without compiling anything. Never save an empty target cache.
          cargo clean --offline --locked --release --target aarch64-linux-android -p ladies-core
          cargo clean --offline --locked -p ladies-core-bindgen
          for deps in target/aarch64-linux-android/release/deps target/debug/deps; do
            if [ ! -d "$deps" ] || [ -z "$(find "$deps" -name '*.rlib' -type f -print -quit)" ]; then
              echo "Compiled dependencies unavailable; skip saving."
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Save Android Rust dependencies
        if: ${{ steps.prepare_rust_cache.outcome == 'success' && steps.prepare_rust_cache.outputs.ready == 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk*
            rust/target
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}

      - name: Verify native task cache contract
        id: native_qualification
        if: ${{ github.event_name == 'workflow_dispatch' && needs.scope.outputs.native_qualification == 'true' }}
        run: bash tools/verify-native-cache.sh

      - name: Measure Android build performance (CI05)
        id: performance_measurement
        if: ${{ github.event_name == 'workflow_dispatch' && needs.scope.outputs.performance_measurement == 'true' }}
        run: bash tools/measure-android-build.sh

      - name: Upload Gradle timing and test reports
        if: ${{ !cancelled() && (steps.gradle.outcome == 'success' || steps.gradle.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-reports
          path: |
            build/reports/profile/
            build/reports/ci05/
            build/reports/kotlin-build/
            app/build/reports/kotlin-build/
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

  # Keep the required check for all events, including documentation-only changes.
  build:
    name: build
    needs: [scope, core, android]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate required CI gate
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          MODE: ${{ needs.scope.outputs.mode }}
          CORE_RESULT: ${{ needs.core.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          NATIVE_REQUIRED: ${{ needs.scope.outputs.native_qualification }}
          PERFORMANCE_REQUIRED: ${{ needs.scope.outputs.performance_measurement }}
          NATIVE_OUTCOME: ${{ needs.android.outputs.native_qualification }}
          PERFORMANCE_OUTCOME: ${{ needs.android.outputs.performance_measurement }}
        run: |
          {
            echo "### Required CI gate"
            echo ""
            echo "| Check | Expected | Actual |"
            echo "| --- | --- | --- |"
            printf '| Scope (%s) | success | %s |\n' "$MODE" "$SCOPE_RESULT"
            if [ "$MODE" = docs ]; then
              echo "| Core and contracts | skipped | $CORE_RESULT |"
              echo "| Android integration | skipped | $ANDROID_RESULT |"
              echo "| Native cache qualification | not run again | ${NATIVE_OUTCOME:-no step (job skipped)} |"
              echo "| Performance measurement | not run again | ${PERFORMANCE_OUTCOME:-no step (job skipped)} |"
            else
              echo "| Core and contracts | success | $CORE_RESULT |"
              echo "| Android integration | success | $ANDROID_RESULT |"
              echo "| Native cache qualification (selected: $NATIVE_REQUIRED) | $(if [ "$NATIVE_REQUIRED" = true ]; then echo success; else echo skipped; fi) | ${NATIVE_OUTCOME:-missing} |"
              echo "| Performance measurement (selected: $PERFORMANCE_REQUIRED) | $(if [ "$PERFORMANCE_REQUIRED" = true ]; then echo success; else echo skipped; fi) | ${PERFORMANCE_OUTCOME:-missing} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          test "$SCOPE_RESULT" = success
          case "$MODE:$NATIVE_REQUIRED:$PERFORMANCE_REQUIRED" in
            docs:false:false)
              test "$CORE_RESULT" = skipped
              test "$ANDROID_RESULT" = skipped
              # No Android job ran: its step outputs must be absent.
              test -z "$NATIVE_OUTCOME"
              test -z "$PERFORMANCE_OUTCOME"
              ;;
            full:false:false|full:true:false|full:false:true|full:true:true)
              test "$CORE_RESULT" = success
              test "$ANDROID_RESULT" = success
              for pair in "$NATIVE_REQUIRED:$NATIVE_OUTCOME" "$PERFORMANCE_REQUIRED:$PERFORMANCE_OUTCOME"; do
                case "$pair" in
                  true:success|false:skipped) ;;
                  *) echo "Qualification selection/outcome mismatch: $pair" >&2; exit 1 ;;
                esac
              done
              ;;
            *) echo "Invalid or incomplete CI policy" >&2; exit 1 ;;
          esac
