name: Android and Rust

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_native_cache:
        description: 'Run the additional CI02 native cache integration probe'
        type: boolean
        default: false
      measure_android_build:
        description: 'Run the additional CI05 Android build diagnostic comparisons'
        type: boolean
        default: false

permissions:
  contents: read

# New commits supersede outdated PR checks, but not main/manual builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      native_qualification: ${{ steps.classify.outputs.native_qualification }}
      performance_measurement: ${{ steps.classify.outputs.performance_measurement }}
      reuse_source: ${{ steps.classify.outputs.reuse_source }}
      reuse_upload: ${{ steps.reuse_upload.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Push ranges may span multiple commits; ancestry needs complete history.
          # For PRs the checked synthetic merge and its parents are sufficient.
          fetch-depth: ${{ github.event_name != 'push' && 2 || 0 }}
          persist-credentials: false
      - name: Verify scope policy
        run: python3 -m unittest discover -s tools -p test_ci_scope.py
      - name: Classify complete event diff
        id: initial
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          VERIFY_NATIVE_CACHE: ${{ inputs.verify_native_cache }}
          MEASURE_ANDROID_BUILD: ${{ inputs.measure_android_build }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_scope.py

      - name: Try verified merge reuse
        id: restore
        if: ${{ github.event_name == 'push' && steps.initial.outputs.mode == 'full' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          NATIVE_REQUIRED: ${{ steps.initial.outputs.native_qualification }}
          PERFORMANCE_REQUIRED: ${{ steps.initial.outputs.performance_measurement }}
        run: python3 tools/ci_reuse.py restore "$RUNNER_TEMP/ci-reused-apk"

      - name: Publish reused main APK
        id: reuse_upload
        if: ${{ steps.restore.outcome == 'success' && steps.restore.outputs.source_run != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ladies-explorer-android-arm64-debug
          path: ${{ runner.temp }}/ci-reused-apk/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Finalize execution policy
        id: classify
        env:
          MODE: ${{ steps.initial.outputs.mode }}
          NATIVE: ${{ steps.initial.outputs.native_qualification }}
          PERFORMANCE: ${{ steps.initial.outputs.performance_measurement }}
          SOURCE: ${{ steps.restore.outputs.source_run }}
          RESTORE: ${{ steps.restore.outcome }}
          UPLOAD: ${{ steps.reuse_upload.outcome }}
        run: |
          if [ "$RESTORE" = success ] && [ "$UPLOAD" = success ] && [[ "$SOURCE" =~ ^[1-9][0-9]*$ ]]; then
            MODE=reuse
            NATIVE=false
            PERFORMANCE=false
          else
            SOURCE=
          fi
          printf 'mode=%s\nnative_qualification=%s\nperformance_measurement=%s\nreuse_source=%s\n' "$MODE" "$NATIVE" "$PERFORMANCE" "$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Validate execution policy
        env:
          MODE: ${{ steps.classify.outputs.mode }}
          NATIVE: ${{ steps.classify.outputs.native_qualification }}
          PERFORMANCE: ${{ steps.classify.outputs.performance_measurement }}
        run: |
          case "$MODE:$NATIVE:$PERFORMANCE" in
            docs:false:false|reuse:false:false|full:false:false|full:true:false|full:false:true|full:true:true) ;;
            *) echo "Invalid or incomplete CI policy" >&2; exit 1 ;;
          esac

  core:
    name: Core and contracts
    needs: scope
    if: ${{ needs.scope.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          persist-credentials: false

      - name: Rust 1.99 host toolchain
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-host
          workspaces: rust -> target
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      # Run independent checks even when another check fails. No failures
      # are ignored; the job and final gate still report failure.
      - name: Architecture source contracts and regression tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          python3 -m unittest discover -s tools -p test_check_architecture.py
          python3 tools/check_architecture.py

      - name: Export script syntax
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash -n tools/export-legacy.sh

      - name: Legacy export bundle round trip
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          if ! command -v sqlite3 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y sqlite3
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/data dir/ladies_data/media/images"
          printf 'sample image\n' > "$tmp/data dir/ladies_data/media/images/test.img"
          sqlite3 "$tmp/data dir/ladies.sqlite3" \
            "PRAGMA user_version=1;
             CREATE TABLE media_assets(local_path TEXT);
             CREATE TABLE listing_snapshots(raw_html_path TEXT);
             INSERT INTO media_assets VALUES('media/images/test.img');"
          ./tools/export-legacy.sh "$tmp/data dir" "$tmp/export.zip"
          unzip -p "$tmp/export.zip" manifest.txt | grep -qx 'ladies-explorer-legacy-v1'
          unzip -p "$tmp/export.zip" assets/media/images/test.img | grep -qx 'sample image'
          unzip -p "$tmp/export.zip" legacy.sqlite3 > "$tmp/restored.sqlite3"
          test "$(sqlite3 "$tmp/restored.sqlite3" "SELECT COUNT(*) FROM media_assets;")" = 1

      - name: Generate synthetic M05 reference
        id: fixture
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 tools/m05-reference.py "$RUNNER_TEMP/m05-reference" --clock 2026-11-18T12:00:00+00:00

      - name: Rust formatting
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Rust unit tests
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        working-directory: rust
        run: cargo test --workspace --locked

      - name: Synthetic reference import
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.fixture.outcome == 'success' }}
        working-directory: rust
        run: M05_REFERENCE_BUNDLE="$RUNNER_TEMP/m05-reference/m05-synthetic.zip" cargo test --workspace --locked m05_reference_bundle_import -- --ignored

      - name: Rust Clippy
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked

  android:
    name: Android integration
    needs: scope
    if: ${{ needs.scope.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      native_qualification: ${{ steps.native_qualification.outcome }}
      performance_measurement: ${{ steps.performance_measurement.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Public repository; enhanced caching evaluation. Set basic here
          # to roll back if the provider is incompatible.
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Rust 1.99 with Android arm64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-android-arm64
          workspaces: rust -> target
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Install cargo-ndk
        run: |
          bash tools/install-cargo-ndk.sh
          test "$(cargo ndk --version)" = 'cargo-ndk 4.1.2'

      - name: Install required Android SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;29.0.14206865"
          # API 37 is distributed as android-37.0; pre-install to avoid AGP first-run SDK discovery issues.
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"

      - name: Build arm64 APK and device test APK, run JVM tests and Android Lint
        id: gradle
        env:
          CI05_DIAGNOSTICS: ${{ needs.scope.outputs.performance_measurement }}
        run: |
          args=()
          if [ "$CI05_DIAGNOSTICS" = true ]; then
            args+=(--info -Dorg.gradle.caching.debug=true -Pkotlin.build.report.output=file)
          fi
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug -Pladies.abis=arm64-v8a -Pladies.nativeCache=true --stacktrace --continue --profile "${args[@]}"

      - name: Verify packaged architecture contracts
        run: |
          set -- app/build/outputs/apk/debug/*.apk
          test "$#" = 1
          test -f "$1"
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          test -x "$aapt2"
          python3 tools/check_architecture.py --apk "$1" --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" --aapt2 "$aapt2"

      - name: Record checked APK tree proof
        env:
          NATIVE_REQUIRED: ${{ needs.scope.outputs.native_qualification }}
          PERFORMANCE_REQUIRED: ${{ needs.scope.outputs.performance_measurement }}
        run: python3 tools/ci_reuse.py record app/build/outputs/apk/debug

      # Publish the checked regular APK before optional qualifications.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ladies-explorer-android-arm64-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/ci-proof.json
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}
          overwrite: true

      # Qualification runs use the same verified policy as the routine build.
      - name: Verify native task cache contract
        id: native_qualification
        if: ${{ needs.scope.outputs.native_qualification == 'true' }}
        run: bash tools/verify-native-cache.sh

      - name: Measure Android build performance (CI05)
        id: performance_measurement
        if: ${{ needs.scope.outputs.performance_measurement == 'true' }}
        run: bash tools/measure-android-build.sh

      - name: Upload Gradle timing and test reports
        if: ${{ !cancelled() && (steps.gradle.outcome == 'success' || steps.gradle.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-reports
          path: |
            build/reports/profile/
            build/reports/ci05/
            build/reports/kotlin-build/
            app/build/reports/kotlin-build/
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

  # Keep the historical check name. A skipped dependency is not green,
  # except for an explicitly proven docs-only PR.
  build:
    name: build
    needs: [scope, core, android]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate required CI gate
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          MODE: ${{ needs.scope.outputs.mode }}
          CORE_RESULT: ${{ needs.core.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          NATIVE_REQUIRED: ${{ needs.scope.outputs.native_qualification }}
          PERFORMANCE_REQUIRED: ${{ needs.scope.outputs.performance_measurement }}
          NATIVE_OUTCOME: ${{ needs.android.outputs.native_qualification }}
          PERFORMANCE_OUTCOME: ${{ needs.android.outputs.performance_measurement }}
          REUSE_SOURCE: ${{ needs.scope.outputs.reuse_source }}
          REUSE_UPLOAD: ${{ needs.scope.outputs.reuse_upload }}
        run: |
          {
            echo "### Required CI gate"
            echo ""
            echo "| Check | Expected | Actual |"
            echo "| --- | --- | --- |"
            printf '| Scope (%s) | success | %s |\n' "$MODE" "$SCOPE_RESULT"
            if [ "$MODE" = docs ] || [ "$MODE" = reuse ]; then
              echo "| Core and contracts | skipped | $CORE_RESULT |"
              echo "| Android integration | skipped | $ANDROID_RESULT |"
              echo "| Native cache qualification | not required | ${NATIVE_OUTCOME:-no step (job skipped)} |"
              echo "| Performance measurement | not run again | ${PERFORMANCE_OUTCOME:-no step (job skipped)} |"
              if [ "$MODE" = reuse ]; then
                echo "| Verified source run | ${REUSE_SOURCE:-missing} | APK upload: ${REUSE_UPLOAD:-missing} |"
              fi
            else
              echo "| Core and contracts | success | $CORE_RESULT |"
              echo "| Android integration | success | $ANDROID_RESULT |"
              echo "| Native cache qualification (selected: $NATIVE_REQUIRED) | $(if [ "$NATIVE_REQUIRED" = true ]; then echo success; else echo skipped; fi) | ${NATIVE_OUTCOME:-missing} |"
              echo "| Performance measurement (selected: $PERFORMANCE_REQUIRED) | $(if [ "$PERFORMANCE_REQUIRED" = true ]; then echo success; else echo skipped; fi) | ${PERFORMANCE_OUTCOME:-missing} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          test "$SCOPE_RESULT" = success
          case "$MODE:$NATIVE_REQUIRED:$PERFORMANCE_REQUIRED" in
            docs:false:false)
              test "$CORE_RESULT" = skipped
              test "$ANDROID_RESULT" = skipped
              # No Android job ran: its step outputs must be absent.
              test -z "$NATIVE_OUTCOME"
              test -z "$PERFORMANCE_OUTCOME"
              ;;
            reuse:false:false)
              test "$CORE_RESULT" = skipped
              test "$ANDROID_RESULT" = skipped
              test -z "$NATIVE_OUTCOME"
              test -z "$PERFORMANCE_OUTCOME"
              test "$REUSE_UPLOAD" = success
              [[ "$REUSE_SOURCE" =~ ^[1-9][0-9]*$ ]]
              ;;
            full:false:false|full:true:false|full:false:true|full:true:true)
              test "$CORE_RESULT" = success
              test "$ANDROID_RESULT" = success
              for pair in "$NATIVE_REQUIRED:$NATIVE_OUTCOME" "$PERFORMANCE_REQUIRED:$PERFORMANCE_OUTCOME"; do
                case "$pair" in
                  true:success|false:skipped) ;;
                  *) echo "Qualification selection/outcome mismatch: $pair" >&2; exit 1 ;;
                esac
              done
              ;;
            *) echo "Invalid or incomplete CI policy" >&2; exit 1 ;;
          esac
