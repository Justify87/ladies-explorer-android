name: Android and Rust

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Rust 1.99 with Android arm64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: aarch64-linux-android
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Export script syntax
        run: bash -n tools/export-legacy.sh

      - name: Rust unit tests and formatting
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo test --workspace

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install required Android SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;29.0.14206865"
          # API 37 is distributed as android-37.0; pre-install to avoid AGP first-run SDK discovery issues.
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"

      - name: Build arm64 APK (automatically builds Rust and UniFFI)
        run: ./gradlew :app:assembleDebug -Pladies.abis=arm64-v8a --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ladies-explorer-android-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
