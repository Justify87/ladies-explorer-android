org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# CI can restrict compilation to one ABI with -Pladies.abis=arm64-v8a.
ladies.abis=arm64-v8a,x86_64
# Shared Android and Rust target minimum API. Keep both build layers aligned.
ladies.minApi=29
