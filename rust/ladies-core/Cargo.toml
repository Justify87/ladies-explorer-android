[package]
name = "ladies-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "ladies_core"
crate-type = ["cdylib", "lib"]

[dependencies]
uniffi = { version = "=0.32.2", default-features = false }
rusqlite = { version = "0.37.0", features = ["bundled", "collation"] }
thiserror = "2.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls", "cookies"] }
scraper = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12"
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
url = "2.5"
sha2 = "0.10.9"
tempfile = "3"
tracing = "=0.1.44"
time = { version = "=0.3.55", features = ["formatting"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
